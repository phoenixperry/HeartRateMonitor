<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Resident Thrum — Coherence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Space+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{
    --light:#EDEDED;     /* neutral white — strict greyscale */
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    background:#070707;
    color:var(--light);
    overflow:hidden;
    font-family:"Space Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
    cursor:crosshair;
  }
  /* #warp holds the scene + grain and receives the keystone (corner-pin) */
  #warp{ position:fixed; top:0; left:0; transform-origin:0 0; z-index:1; transition:opacity .6s ease; }
  #stage{ position:absolute; top:0; left:0; display:block; }

  /* evolving film grain — a noise canvas regenerated ~24fps over everything */
  #grain{
    position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;
    opacity:.15; mix-blend-mode:soft-light;
  }

  .frame{ position:fixed; inset:0; pointer-events:none; z-index:3; }

  /* both labels share one quiet, light treatment */
  .mark{
    position:absolute; left:30px; top:28px;
    font-weight:500; font-size:13px; letter-spacing:.02em;
    text-transform:uppercase; color:rgba(237,237,237,.80);
  }
  .mark small{
    display:block; margin-top:7px;
    font-family:"Space Mono", monospace; font-weight:400;
    font-size:10px; letter-spacing:.16em; text-transform:uppercase;
    color:rgba(237,237,237,.30);
  }

  .state{
    position:absolute; left:30px; bottom:28px;
    font-weight:500; font-size:13px; letter-spacing:.02em;
    text-transform:uppercase; color:rgba(237,237,237,.80);
  }

  /* faint key legend (normal mode only) */
  #keys{
    position:fixed; right:30px; bottom:30px; z-index:3; text-align:right;
    font-family:"Space Mono", monospace; font-size:9.5px; letter-spacing:.10em;
    text-transform:uppercase; color:rgba(237,237,237,.22); pointer-events:none;
  }

  /* ---- keystone calibration overlay ---- */
  #handles{ position:fixed; inset:0; z-index:5; display:none; pointer-events:none; }
  body.calibrate #handles{ display:block; }
  .handle{
    position:absolute; width:24px; height:24px; margin:-12px 0 0 -12px;
    border:1.5px solid #6CC8FF; border-radius:50%;
    background:rgba(108,200,255,.12); cursor:grab; pointer-events:auto;
    box-shadow:0 0 0 1px rgba(0,0,0,.5);
  }
  .handle:active{ cursor:grabbing; }
  .handle::after{
    content:''; position:absolute; left:50%; top:50%; width:2px; height:2px;
    margin:-1px 0 0 -1px; background:#6CC8FF;
  }
  #help{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:6;
    display:none; font-family:"Space Mono", monospace; font-size:10px;
    letter-spacing:.12em; text-transform:uppercase; color:rgba(108,200,255,.95);
    background:rgba(0,0,0,.55); padding:9px 15px; border-radius:4px;
  }
  body.calibrate #help{ display:block; }

  /* ---- projection / fullscreen: true black, pure visuals, no chrome ---- */
  body.projection{ background:#000; }
  body.projection .frame, body.projection #keys,
  body.fullscreen .frame, body.fullscreen #keys{ display:none; }

  /* cursor: hidden in projection or when toggled off (H), but ALWAYS shown
     while calibrating so you can grab the corners (last rule wins) */
  body.projection, body.hidecursor{ cursor:none; }
  body.calibrate{ cursor:crosshair; }
</style>
</head>
<body>
  <div id="warp">
    <canvas id="stage"></canvas>
    <canvas id="grain"></canvas>
  </div>

  <div class="frame">
    <div class="mark">Resident Thrum<small>Coherence — Study vi</small></div>
    <div class="state" id="word">Dispersed</div>
  </div>

  <div id="keys">F&nbsp;fullscreen · P&nbsp;projection · C&nbsp;keystone · H&nbsp;cursor · 0–9&nbsp;opacity · [&nbsp;]&nbsp;look</div>

  <div id="handles">
    <div class="handle" data-i="0"></div>
    <div class="handle" data-i="1"></div>
    <div class="handle" data-i="2"></div>
    <div class="handle" data-i="3"></div>
  </div>
  <div id="help">Drag the four corners onto the floor · R reset · H cursor · C exit</div>

<script>
/* ===================================================================
   RESIDENT THRUM — Coherence  (black-dominant, monotone light)
   Six hearts at the vertices of a hexagon. Their beats are six phase-
   oscillators coupled by the Kuramoto model — the real mathematics of
   spontaneous synchronisation. As coupling rises they entrain; the order
   parameter r (0..1) is the sync rate. Each pulse is soft light; where
   the six overlap at the centre the light accumulates, so coherence
   gathers as luminance. Structure is two triangles — no rings.
   =================================================================== */
const cv = document.getElementById('stage');
const ctx = cv.getContext('2d', { alpha:false });
const grain = document.getElementById('grain');
const gctx = grain.getContext('2d');
const wordEl = document.getElementById('word');
const LIGHT = [237,237,237];  // neutral white — strict greyscale
const lightA = a => 'rgba('+LIGHT[0]+','+LIGHT[1]+','+LIGHT[2]+','+a+')';

/* ---- look presets — edit values / add more; switch live with [ and ] ----
   hex    = honeycomb understructure line opacity
   circle = peak opacity of each expanding glow                              */
const PRESETS = [
  { hex: 0.05, circle: 0.16 },   // 0 — original (subtle hex, softer glow)
  { hex: 0.10, circle: 0.22 },   // 1 — brighter (current)
];
let preset = 1;                   // active preset index

/* ---- keystone (corner-pin) + projection mode ------------------------
   Keys:  F fullscreen · P projection (true black, no labels) · C keystone
   In keystone mode drag the four corners onto the floor; R resets.
   Corners persist in localStorage. Both modes coexist.                  */
const warp = document.getElementById('warp');
const handleEls = [...document.querySelectorAll('.handle')];
let projection = false, calibrating = false;

function loadCorners(){ try{ const s=localStorage.getItem('thrum.corners'); if(s) return JSON.parse(s); }catch(e){} return null; }
function saveCorners(){ try{ localStorage.setItem('thrum.corners', JSON.stringify(corners)); }catch(e){} }
// corners: TL, TR, BR, BL as fractions of the viewport (identity by default)
let corners = loadCorners() || [[0,0],[1,0],[1,1],[0,1]];

// 3x3 maths for the corner-pin homography → CSS matrix3d
function adj(m){ return [
  m[4]*m[8]-m[5]*m[7], m[2]*m[7]-m[1]*m[8], m[1]*m[5]-m[2]*m[4],
  m[5]*m[6]-m[3]*m[8], m[0]*m[8]-m[2]*m[6], m[2]*m[3]-m[0]*m[5],
  m[3]*m[7]-m[4]*m[6], m[1]*m[6]-m[0]*m[7], m[0]*m[4]-m[1]*m[3] ]; }
function mulmm(a,b){ const c=[]; for(let i=0;i<3;i++)for(let j=0;j<3;j++){ let s=0;
  for(let k=0;k<3;k++) s+=a[3*i+k]*b[3*k+j]; c[3*i+j]=s; } return c; }
function mulmv(m,v){ return [ m[0]*v[0]+m[1]*v[1]+m[2]*v[2],
  m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2] ]; }
function basisToPoints(x1,y1,x2,y2,x3,y3,x4,y4){
  const m=[x1,x2,x3, y1,y2,y3, 1,1,1];
  const v=mulmv(adj(m),[x4,y4,1]);
  return mulmm(m,[v[0],0,0, 0,v[1],0, 0,0,v[2]]);
}
function projectionFromQuads(s,d){ return mulmm(basisToPoints.apply(null,d), adj(basisToPoints.apply(null,s))); }

function updateWarp(){
  const s=[0,0, W,0, W,H, 0,H];
  const d=[corners[0][0]*W,corners[0][1]*H, corners[1][0]*W,corners[1][1]*H,
           corners[2][0]*W,corners[2][1]*H, corners[3][0]*W,corners[3][1]*H];
  const t=projectionFromQuads(s,d);
  for(let i=0;i<9;i++) t[i]/=t[8];
  const m=[t[0],t[3],0,t[6], t[1],t[4],0,t[7], 0,0,1,0, t[2],t[5],0,t[8]];
  warp.style.transform='matrix3d('+m.join(',')+')';
}
function positionHandles(){
  // keep the grip fully on-screen (inset by a margin) so edge/bottom corners
  // are always grabbable — the corner value itself is unclamped.
  const m = 18;
  handleEls.forEach((h,i)=>{
    h.style.left = Math.max(m, Math.min(W-m, corners[i][0]*W))+'px';
    h.style.top  = Math.max(m, Math.min(H-m, corners[i][1]*H))+'px';
  });
}
handleEls.forEach((h,i)=>{
  h.addEventListener('pointerdown', e=>{
    e.preventDefault(); h.setPointerCapture(e.pointerId);
    const move=ev=>{ corners[i]=[clamp(ev.clientX/W,-1,2), clamp(ev.clientY/H,-1,2)]; updateWarp(); positionHandles(); };
    const up=()=>{ h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); saveCorners(); };
    h.addEventListener('pointermove',move); h.addEventListener('pointerup',up);
  });
});
window.addEventListener('keydown', e=>{
  const k=e.key.toLowerCase();
  if(k==='f'){ document.fullscreenElement ? document.exitFullscreen?.() : document.documentElement.requestFullscreen?.(); }
  else if(k==='p'){ projection=!projection; document.body.classList.toggle('projection',projection); }
  else if(k==='c'){ calibrating=!calibrating; document.body.classList.toggle('calibrate',calibrating); if(calibrating) pointer.active=false; }
  else if(k==='r'){ corners=[[0,0],[1,0],[1,1],[0,1]]; updateWarp(); positionHandles(); saveCorners(); }
  else if(k==='h'){ document.body.classList.toggle('hidecursor'); }
  else if(k>='0' && k<='9'){ warp.style.opacity = (Number(k)+1)/10; }  // 0=10% (dimmest) … 9=100%
  else if(k==='['){ preset = (preset - 1 + PRESETS.length) % PRESETS.length; }  // prev look
  else if(k===']'){ preset = (preset + 1) % PRESETS.length; }                   // next look
});
// fullscreen → pure visuals (hide title, words, key legend)
document.addEventListener('fullscreenchange', ()=>{
  document.body.classList.toggle('fullscreen', !!document.fullscreenElement);
});

let W, H, DPR, CX, CY, R, D;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  cv.style.width = W+'px'; cv.style.height = H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  CX = W/2; CY = H/2;
  R = Math.min(W,H) * 0.15;       // hexagon circumradius (centre→vertex)
  D = Math.sqrt(3) * R;           // tile centre→centre (shared-edge honeycomb)
  // grain buffer at CSS resolution (independent of DPR) — fine filmic grain
  grain.width = Math.max(2, Math.round(W * 0.7));
  grain.height = Math.max(2, Math.round(H * 0.7));
  warp.style.width = W+'px'; warp.style.height = H+'px';
  updateWarp(); positionHandles();
}
window.addEventListener('resize', resize); resize();

/* ---- six oscillators ------------------------------------------------ */
const N = 6;
const TAU = Math.PI*2;
const osc = [];
for(let i=0;i<N;i++){
  osc.push({
    ang:  -Math.PI/2 + i*TAU/N,
    omega: TAU*(1.00 + (Math.random()*2-1)*0.10),
    phase: Math.random()*TAU,
    lastBeat: 0,
    ripples: []
  });
}

/* ---- coupling: a slow breath, plus the viewer's pull ---------------- */
let K = 0.4;
let pointer = {x:CX, y:CY, active:false};
window.addEventListener('pointermove', e=>{ if(calibrating) return; pointer.x=e.clientX; pointer.y=e.clientY; pointer.active=true; });
window.addEventListener('pointerleave', ()=> pointer.active=false );
window.addEventListener('pointerdown', ()=>{ for(const o of osc) o.phase += (Math.random()*2-1)*1.4; });

/* ---- helpers -------------------------------------------------------- */
const lerp  = (a,b,t)=> a+(b-a)*t;
const clamp = (x,a,b)=> x<a?a:(x>b?b:x);
const smooth= (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };
// each player's tile centre sits one honeycomb step out from the middle
function seatXY(o){ return [CX + Math.cos(o.ang)*D, CY + Math.sin(o.ang)*D]; }

function coherence(){
  let sx=0, sy=0;
  for(const o of osc){ sx+=Math.cos(o.phase); sy+=Math.sin(o.phase); }
  return { r: Math.hypot(sx,sy)/N, psi: Math.atan2(sy,sx) };
}

/* ---- simulation ----------------------------------------------------- */
let t0 = performance.now()/1000, clock=0;
function step(dt){
  clock += dt;
  const breath = (1 - Math.cos(clock * TAU/26))/2;
  let target = lerp(0.25, 5.2, smooth(0,1,breath));
  if(pointer.active){
    const d = Math.hypot(pointer.x-CX, pointer.y-CY);
    const pull = smooth(R*1.25, R*0.15, d);
    target = Math.max(target, lerp(0.4, 6.5, pull));
  }
  K += (target - K) * Math.min(1, dt*1.6);

  for(const o of osc){
    let coupling = 0;
    for(const p of osc) coupling += Math.sin(p.phase - o.phase);
    o.phase += (o.omega + (K/N)*coupling) * dt;
    const beat = Math.floor(o.phase/TAU);
    if(beat > o.lastBeat){ o.lastBeat = beat; o.ripples.push({age:0}); }
    for(const rp of o.ripples) rp.age += dt;
    o.ripples = o.ripples.filter(rp=>rp.age < 2.2);
  }
}

/* ---- painting ------------------------------------------------------- */
function nightBackground(){
  if(projection){ ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H); return; } // true black for projector
  const g = ctx.createRadialGradient(CX,CY, R*0.1, CX,CY, Math.max(W,H)*0.7);
  g.addColorStop(0, '#1B1B1D');   // lifted off pure black — gentler contrast
  g.addColorStop(1, '#0F0F11');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
}

// one flat honeycomb hexagon (vertices at 60° steps; edges face the neighbours)
function drawHex(cx, cy, rad, a){
  ctx.strokeStyle = lightA(a);
  ctx.lineWidth = 1; ctx.lineJoin='round';
  ctx.beginPath();
  for(let k=0;k<6;k++){
    const ang = k*Math.PI/3;
    const x = cx + Math.cos(ang)*rad, y = cy + Math.sin(ang)*rad;
    k ? ctx.lineTo(x,y) : ctx.moveTo(x,y);
  }
  ctx.closePath(); ctx.stroke();
}

// static structure: the centre tile + six tiles around it (7 total)
function hexes(){
  ctx.save();
  const hx = PRESETS[preset].hex;
  drawHex(CX, CY, R, hx);
  for(const o of osc){ const [x,y]=seatXY(o); drawHex(x, y, R, hx); }
  ctx.restore();
}

function constellation(r){
  ctx.save();
  ctx.lineCap='round';
  for(let i=0;i<N;i++) for(let j=i+1;j<N;j++){
    const align = (Math.cos(osc[i].phase - osc[j].phase)+1)/2;
    const a = align*align * (0.08 + 0.45*r);
    if(a < 0.02) continue;
    const [x1,y1]=seatXY(osc[i]), [x2,y2]=seatXY(osc[j]);
    ctx.strokeStyle = lightA(a*0.45);
    ctx.lineWidth = 0.6 + align*r*1.0;
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke();
  }
  ctx.restore();
}

function heart(o){
  const [x,y] = seatXY(o);
  const maxReach = D * 1.35;   // each circle travels past the centre tile

  // one soft circle per beat, expanding OUTWARD and fading — no in-place
  // pulse. 'screen' (not additive) so overlaps blend gently instead of
  // blowing out to harsh white.
  ctx.globalCompositeOperation = 'screen';
  for(const rp of o.ripples){
    const tt = clamp(rp.age/2.2, 0, 1);
    const rr = tt * maxReach;
    if(rr < 1) continue;
    const a = smooth(0,0.10,tt) * (1-tt)*(1-tt) * PRESETS[preset].circle; // fade in fast, out slow
    const width = lerp(8, 30, tt);                      // softens as it grows
    const inner = Math.max(0, rr - width), outer = rr + width;
    const g = ctx.createRadialGradient(x,y,inner, x,y,outer);
    g.addColorStop(0,   lightA(0));
    g.addColorStop(0.5, lightA(a));
    g.addColorStop(1,   lightA(0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x,y,outer,0,TAU); ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';
}

/* ---- state words (designer, plain language) ------------------------- */
const STATES = [
  [0.00,'Dispersed'],
  [0.30,'Gathering'],
  [0.55,'Entraining'],
  [0.80,'Coherent'],
  [0.955,'Unison'],
];
let curState = -1;
function setState(r){
  let idx=0; for(let i=0;i<STATES.length;i++) if(r>=STATES[i][0]) idx=i;
  if(idx!==curState){ curState=idx; wordEl.textContent = STATES[idx][1]; }
}

/* ---- evolving film grain -------------------------------------------- */
let lastGrain = 0;
function filmGrain(now){
  if(now - lastGrain < 1000/24) return;   // ~24fps: film cadence, gentler than 60
  lastGrain = now;
  const img = gctx.createImageData(grain.width, grain.height);
  const d = img.data;
  for(let i=0;i<d.length;i+=4){
    const v = (Math.random()*255)|0;      // monochrome noise
    d[i]=d[i+1]=d[i+2]=v; d[i+3]=255;
  }
  gctx.putImageData(img, 0, 0);
}

/* ---- main loop ------------------------------------------------------ */
function frame(now){
  const tn = now/1000;
  let dt = tn - t0; t0 = tn;
  dt = Math.min(dt, 0.05);
  step(dt);

  const {r,psi} = coherence();

  nightBackground();
  hexes();
  for(const o of osc) heart(o);
  ctx.globalCompositeOperation='source-over';

  setState(r);
  filmGrain(now);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
